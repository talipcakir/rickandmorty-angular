@let item = character();

<mat-card class="card" appearance="outlined">
  <a class="card__media" [routerLink]="['/character', item.id]" [attr.aria-label]="item.name">
    <img mat-card-image [ngSrc]="item.image" [alt]="item.name" width="300" height="300" priority />
  </a>

  <mat-card-content class="card__content">
    <a class="card__title" [routerLink]="['/character', item.id]">{{ item.name }}</a>

    <p class="card__status">
      <span
        class="card__status-dot"
        [class]="'card__status-dot--' + item.status.toLowerCase()"
      ></span>
      {{ item.status }} — {{ item.species }}
    </p>

    <dl class="card__meta">
      <dt>Gender</dt>
      <dd>{{ item.gender }}</dd>
      <dt>Origin</dt>
      <dd>{{ item.origin.name }}</dd>
    </dl>
  </mat-card-content>

  <mat-card-actions align="end">
    <a mat-button color="primary" [routerLink]="['/character', item.id]">Details</a>
  </mat-card-actions>
</mat-card>
