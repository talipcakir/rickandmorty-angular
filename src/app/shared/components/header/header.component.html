<mat-toolbar class="header">
  <a class="header__brand" routerLink="/characters">
    <span class="header__portal" aria-hidden="true"></span>
    {{ title() }}
  </a>

  <nav class="header__nav">
    @for (link of links; track link.path) {
      <a
        mat-button
        [routerLink]="link.path"
        routerLinkActive="header__link--active"
        [routerLinkActiveOptions]="{ exact: false }"
      >
        <mat-icon>{{ link.icon }}</mat-icon>
        <span class="header__link-label">{{ link.label }}</span>
      </a>
    }
  </nav>

  <button
    mat-icon-button
    class="header__theme"
    type="button"
    (click)="toggleTheme()"
    [attr.aria-label]="theme() === 'dark' ? 'Switch to light theme' : 'Switch to dark theme'"
  >
    <mat-icon>{{ theme() === 'dark' ? 'light_mode' : 'dark_mode' }}</mat-icon>
  </button>
</mat-toolbar>
