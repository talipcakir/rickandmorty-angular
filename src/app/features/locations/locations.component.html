<section class="page">
  <div class="page__head">
    <h1 class="page__title">Locations</h1>
    @if (totalCount()) {
      <span class="page__count">{{ totalCount() }} results</span>
    }
  </div>

  <app-location-filter (filterChange)="onFilterChange($event)" />

  <div class="progress" aria-live="polite">
    @if (isLoading()) {
      <mat-progress-bar mode="indeterminate" />
    }
  </div>

  @if (hasError()) {
    <div class="state">
      <mat-icon class="state__icon">cloud_off</mat-icon>
      <p>Something went wrong while loading locations.</p>
      <button mat-flat-button (click)="retry()">Try again</button>
    </div>
  } @else if (notFound()) {
    <div class="state">
      <mat-icon class="state__icon">search_off</mat-icon>
      <p>No locations match your filters.</p>
    </div>
  } @else {
    <div class="grid">
      @for (location of locations(); track location.id) {
        <app-location-card [location]="location" />
      }
    </div>
  }
</section>

<app-pagination
  class="pagination-bar"
  [length]="totalCount()"
  [pageIndex]="page() - 1"
  [disabled]="isLoading()"
  (pageChange)="onPageChange($event)"
/>
